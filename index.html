<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Boutique Maryam — Premium Digital Identity & Collections</title>
  <meta name="description" content="Discover luxury pret, unstitched lawn, festive edits, and boutique fashion collections from Boutique Maryam. Save contact and connect directly." />
  <meta name="theme-color" content="#faf8fb" />

  <!-- Preconnect for High-Speed Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS & Custom Design System -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="public-body">
  <main class="min-h-screen px-3 py-6 sm:px-6 sm:py-10 flex flex-col justify-center">
    <div class="card-outer-wrap">
      <!-- Digital Visiting Card Container -->
      <article id="phoneCard" class="phone-scroll" aria-label="Digital Visiting Card for Boutique Maryam">
        <!-- Ambient Subtle Top Glow -->
        <div class="card-ambient-glow" aria-hidden="true"></div>

        <!-- Card Header: Brand Identity -->
        <header class="card-header-identity">
          <!-- Verified Badge -->
          <div class="verified-identity-badge" title="Verified Digital Visiting Card">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span>Verified Boutique</span>
          </div>

          <!-- Profile / Brand Logo with Halo -->
          <div class="brand-avatar-frame">
            <div class="brand-avatar-halo">
              <div class="brand-avatar-inner">
                <img id="previewLogo" src="assets/logo.png" alt="Boutique Maryam Official Logo" width="80" height="80" />
              </div>
            </div>
          </div>

          <!-- Brand Typography -->
          <h1 id="previewBrand">Boutique Maryam</h1>
          <p class="brand-tagline">Luxury Pret &amp; Couture Collections</p>

          <!-- Username & Copy Link Badge -->
          <button id="previewUsername" type="button" title="Click to copy card link" aria-label="Copy digital card link">
            <span>Loading....</span>
            <svg class="w-3.5 h-3.5 ml-0.5 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>

          <!-- Quick Action Buttons: Save Contact & Share Card -->
          <div class="card-action-bar">
            <button id="saveContactBtn" type="button" class="card-action-btn card-action-primary" aria-label="Save contact to phone address book">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
              <span>Save Contact</span>
            </button>

            <button id="shareCardBtn" type="button" class="card-action-btn card-action-secondary" aria-label="Share digital card or show QR code">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
              <span>Share Card</span>
            </button>
          </div>

          <!-- Social Media Grid -->
          <nav class="social-grid-wrap" aria-label="Social media connections">
            <a id="whatsappLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp-icon" aria-label="Chat on WhatsApp" title="WhatsApp">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.9c0 2.1.6 4.1 1.6 5.9L0 24l6.4-1.7a11.9 11.9 0 0 0 5.7 1.5c6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.4ZM12.1 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.4 4.7Zm5.4-7.4c-.3-.2-1.7-.9-2-.9-.3-.1-.5-.2-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.4-1.5-.9-.8-1.5-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2.1-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5 4.4.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4Z"/></svg>
            </a>
            <a id="instagramLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn instagram-icon" aria-label="Instagram Profile" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8Zm8.8 2.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4ZM12 7.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8Zm0 2a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8Z"/></svg>
            </a>
            <a id="facebookLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn facebook-icon" aria-label="Facebook Page" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.2h-3.3V8.5c0-.9.3-1.6 1.7-1.6h1.8V4.1c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5v2.1H7.1v3.2H10V22h3.5Z"/></svg>
            </a>
            <a id="tiktokLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn tiktok-icon" aria-label="TikTok Profile" title="TikTok">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 2c.3 2.5 1.7 4 4.2 4.2v3.2a7.8 7.8 0 0 1-4.1-1.2v6.4c0 4.1-2.5 7.4-7 7.4-3.7 0-6.7-2.5-6.7-6.3 0-4.4 3.7-6.9 7.8-6.2v3.4c-1.9-.6-4.4.5-4.4 2.8 0 1.6 1.3 2.8 3.1 2.8 2 0 3.3-1.2 3.3-3.9V2h3.8Z"/></svg>
            </a>
            <a id="pinterestLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn pinterest-icon" aria-label="Pinterest Boards" title="Pinterest">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-.8-.2-2 .1-2.9l1.2-5.1s-.3-.6-.3-1.5c0-1.4.8-2.5 1.8-2.5.9 0 1.3.6 1.3 1.4 0 .9-.6 2.2-.9 3.4-.2 1 .5 1.9 1.6 1.9 1.9 0 3.3-2 3.3-4.9 0-2.6-1.8-4.4-4.5-4.4-3.1 0-4.9 2.3-4.9 4.7 0 .9.4 1.9.8 2.5.1.1.1.2.1.4l-.3 1.2c0 .2-.2.3-.4.2-1.4-.7-2.3-2.7-2.3-4.4C5 7.7 7.6 4.6 12.3 4.6c3.8 0 6.8 2.7 6.8 6.4 0 3.8-2.4 6.9-5.7 6.9-1.1 0-2.2-.6-2.5-1.3l-.7 2.6c-.3.9-1 2.1-1.4 2.8A10 10 0 1 0 12 2Z"/></svg>
            </a>
            <a id="websiteLink" href="#" target="_blank" rel="noopener noreferrer" class="social-btn website-icon" aria-label="Official Website" title="Website">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3.1a15.2 15.2 0 0 0-1.1-5.1A8 8 0 0 1 18.9 11ZM12 4.1c.7 1 1.5 3.1 1.7 6.9h-3.4c.2-3.8 1-5.9 1.7-6.9ZM4.3 13h3.9a15.2 15.2 0 0 0 1.1 5.1A8 8 0 0 1 4.3 13Zm3.9-2H5.1a8 8 0 0 1 4.2-5.1A15.2 15.2 0 0 0 8.2 11Zm3.8 8.9c-.7-1-1.5-3.1-1.7-6.9h3.4c-.2 3.8-1 5.9-1.7 6.9Zm2.7-1.8a15.2 15.2 0 0 0 1.1-5.1h3.1a8 8 0 0 1-4.2 5.1Z"/></svg>
            </a>
          </nav>
        </header>

        <!-- Divider -->
        <div class="card-divider" aria-hidden="true"></div>

        <!-- Collections & Links Container -->
        <section id="linksPublic" aria-label="Collections and Links">
          <!-- Premium Shimmering Skeleton Loaders -->
          <div class="link-pill skeleton-box h-[64px]" aria-hidden="true"></div>
          <div class="link-pill skeleton-box h-[64px]" aria-hidden="true"></div>
          <div class="link-pill skeleton-box h-[64px]" aria-hidden="true"></div>
        </section>

        <!-- Bottom Brand Footer -->
        <footer class="card-bottom-bar">
          <a href="https://wa.me/923000000000" id="mainCtaBtn" target="_blank" rel="noopener noreferrer" class="card-brand-pill-btn">
            <span>Inquire on WhatsApp</span>
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
          <p class="card-brand-footer-text">
            Boutique Maryam • Premium Identity • <a href="admin.html">Admin</a>
          </p>
        </footer>
      </article>
    </div>
  </main>

  <!-- Share & QR Code Modal Dialog -->
  <div id="shareModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="modal-surface">
      <button id="closeShareModalBtn" type="button" class="modal-close-btn" aria-label="Close share dialog">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>

      <div class="text-center">
        <h3 id="shareModalTitle" class="text-lg font-extrabold text-gray-900">Share Digital Card</h3>
        <p class="text-xs text-gray-500 mt-1">Scan QR code or copy direct link to share this profile.</p>

        <!-- Dynamic QR Code Frame -->
        <div class="qr-code-box">
          <img id="qrCodeImg" src="" alt="Digital Business Card QR Code" width="160" height="160" class="object-contain" />
        </div>

        <!-- Copy Link Input -->
        <div class="flex items-center gap-2 mt-4">
          <input id="shareUrlInput" type="text" readonly class="input text-xs py-2 px-3 bg-gray-50 text-gray-700" value="" />
          <button id="copyShareUrlBtn" type="button" class="btn-primary py-2 px-4 text-xs flex-shrink-0">Copy</button>
        </div>

        <div class="mt-4 pt-3 border-t border-gray-100 flex gap-2 justify-center">
          <a id="shareWhatsappBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary text-xs py-2 px-4 gap-2">
            <svg class="w-4 h-4 text-emerald-600 fill-current" viewBox="0 0 24 24"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.9c0 2.1.6 4.1 1.6 5.9L0 24l6.4-1.7a11.9 11.9 0 0 0 5.7 1.5c6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.4ZM12.1 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.4 4.7Z"/></svg>
            <span>WhatsApp</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
